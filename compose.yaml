name: grimoire

services:
  app:
    build:
      context: .
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: app
      GRIMOIRE_ALLOWED_HOSTS: ${GRIMOIRE_ALLOWED_HOSTS:-}
    restart: unless-stopped
    networks:
      - grimoire

networks:
  grimoire:
    name: grimoire-network
    driver: bridge
